services:
  retropie-service:
    image: ${RETROPIE_IMAGE:-manzolo/retropie:latest}
    container_name: ${CONTAINER_NAME:-retropie-container}
    runtime: nvidia
    stdin_open: true
    tty: true
    network_mode: host
    security_opt:
      - apparmor:unconfined
    shm_size: 512M
    devices:
      - /dev/input
      - /dev/uinput
      - /dev/snd
      - /dev/dri
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      WAYLAND_DISPLAY: ${WAYLAND_DISPLAY:-wayland-0}
      XDG_RUNTIME_DIR: /run/user/${PUID:-1000}
      XDG_SESSION_TYPE: wayland
      DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/${PUID:-1000}/bus
      DISPLAY: ${DISPLAY}
      QT_QPA_PLATFORM: xcb
      XAUTHORITY: /tmp/retropie.xauth
      PULSE_SERVER: unix:/run/user/${PUID:-1000}/pulse/native
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: graphics,display,video,compute,utility
      SDL_VIDEODRIVER: ${SDL_VIDEODRIVER:-wayland,x11}
      GDK_BACKEND: ${GDK_BACKEND:-wayland,x11}
      MOZ_ENABLE_WAYLAND: '1'
      RETROPIE_EXTERNAL_ROMS: ${RETROPIE_EXTERNAL_ROMS:-0}
      TZ: ${TZ:-Europe/Rome}
    volumes:
      - type: bind
        source: ${RETROPIE_DATA_DIR:-./data}
        target: /data
        bind:
          create_host_path: false
      - ${XDG_RUNTIME_DIR}/${WAYLAND_DISPLAY:-wayland-0}:/run/user/${PUID:-1000}/${WAYLAND_DISPLAY:-wayland-0}:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ${XAUTHORITY:-/dev/null}:/tmp/retropie.xauth:ro
      - ${XDG_RUNTIME_DIR}/pulse:/run/user/${PUID:-1000}/pulse:ro
      - /etc/machine-id:/etc/machine-id:ro
      - ${XDG_RUNTIME_DIR}/bus:/run/user/${PUID:-1000}/bus:ro
      - /run/dbus:/run/dbus:ro
      - /run/udev/data:/run/udev/data:ro
      - /etc/localtime:/etc/localtime:ro
