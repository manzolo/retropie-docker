# The GPU and the desktop session come from overrides the launcher adds (scripts/retropie.sh):
# docker-compose.nvidia.yml (host driver via the NVIDIA Container Toolkit) and
# docker-compose.wayland.yml (Wayland socket). Without them: Mesa on X11.
services:
  retropie-service:
    image: ${RETROPIE_IMAGE:-manzolo/retropie:latest}
    container_name: ${CONTAINER_NAME:-retropie-container}
    stdin_open: true
    tty: true
    network_mode: host
    security_opt:
      - apparmor:unconfined
    shm_size: 512M
    devices:
      - /dev/input
      - /dev/uinput
      - /dev/snd
      - /dev/dri
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      XDG_RUNTIME_DIR: /run/user/${PUID:-1000}
      XDG_SESSION_TYPE: ${RETROPIE_SESSION:-x11}
      DBUS_SESSION_BUS_ADDRESS: unix:path=/run/user/${PUID:-1000}/bus
      DISPLAY: ${DISPLAY}
      QT_QPA_PLATFORM: xcb
      XAUTHORITY: /tmp/retropie.xauth
      PULSE_SERVER: unix:/run/user/${PUID:-1000}/pulse/native
      SDL_VIDEODRIVER: ${SDL_VIDEODRIVER:-x11}
      GDK_BACKEND: ${GDK_BACKEND:-x11}
      RETROPIE_EXTERNAL_ROMS: ${RETROPIE_EXTERNAL_ROMS:-0}
      TZ: ${TZ:-Europe/Rome}
    volumes:
      - type: bind
        source: ${RETROPIE_DATA_DIR:-./data}
        target: /data
        bind:
          create_host_path: false
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ${XAUTHORITY:-/dev/null}:/tmp/retropie.xauth:ro
      - ${XDG_RUNTIME_DIR}/pulse:/run/user/${PUID:-1000}/pulse:ro
      - /etc/machine-id:/etc/machine-id:ro
      - ${XDG_RUNTIME_DIR}/bus:/run/user/${PUID:-1000}/bus:ro
      - /run/dbus:/run/dbus:ro
      - /run/udev/data:/run/udev/data:ro
      - /etc/localtime:/etc/localtime:ro
